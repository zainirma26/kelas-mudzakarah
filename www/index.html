<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Kelas Online</title>
<script src="https://cdn.jsdelivr.net/npm/livekit-client@2/dist/livekit-client.umd.min.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ======= Layar masuk ======= -->
<div id="join" class="screen active">
  <div class="card">
    <h1>📚 Kelas Online</h1>
    <p class="sub">Streaming belajar tanpa delay (WebRTC)</p>

    <label>Nama kamu</label>
    <input id="userName" placeholder="Nama" autocomplete="off">

    <label>Mata pelajaran</label>
    <input id="subject" placeholder="Tulis mata pelajaran, mis. Matematika" autocomplete="off">
    <p class="sub" style="margin-top:6px">Murid harus menulis nama yang sama dengan yang ditulis guru.</p>

    <label>Masuk sebagai</label>
    <select id="role">
      <option value="murid">Murid</option>
      <option value="guru">Guru</option>
    </select>

    <div id="classPinTWrap" style="display:none">
      <label>PIN murid untuk kelas ini</label>
      <input id="classPinT" type="password" inputmode="numeric" placeholder="Buat PIN murid (4-12 angka)">
      <p class="sub" id="classPinTHint" style="margin-top:6px"></p>
    </div>
    <div id="classPinWrap" style="display:none">
      <label>PIN kelas (dari guru)</label>
      <input id="classPin" type="password" inputmode="numeric" placeholder="PIN dari guru">
    </div>

    <button class="primary" id="joinBtn">Masuk Kelas</button>
    <div id="err"></div>
  </div>
</div>

<!-- ======= Layar kelas ======= -->
<div id="room" class="screen">
  <div id="main" style="position:relative">
    <div id="status">Menyambung…</div>
    <div id="count"></div>
    <div id="stage"><div class="empty" id="stageEmpty">Menunggu guru bergabung…</div><button id="endSpot">✖ Akhiri presentasi</button></div>
    <div id="strip"></div>
  </div>
  <div id="bar">
    <button id="micBtn" title="Mikrofon">🎤</button>
    <button id="camBtn" title="Kamera">📷</button>
    <button id="flipBtn" title="Balik kamera">🔄</button>
    <button id="spkBtn" title="Suara peserta lain">🔊</button>
    <button id="saveBtn" title="Hemat data (sembunyikan video murid lain)">📶</button>
    <button id="leaveBtn" class="leave" title="Keluar">📞</button>
  </div>
</div>

<div id="toast"></div>
<script src="env.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
